<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Single Sign-On Lab - Admin</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background: #0f172a;
        color: #e5e7eb;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      .container {
        background: #111827;
        padding: 2rem 2.5rem;
        border-radius: 0.75rem;
        box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        width: 420px;
        text-align: center;
      }
      h1 {
        margin-top: 0;
        font-size: 1.6rem;
        margin-bottom: 0.75rem;
      }
      .flag {
        margin-top: 1rem;
        padding: 0.8rem 1rem;
        border-radius: 0.5rem;
        background: #022c22;
        border: 1px solid #10b981;
        font-family: "Fira Code", monospace;
        font-size: 0.95rem;
      }
      a {
        display: inline-block;
        margin-top: 1.5rem;
        color: #60a5fa;
        text-decoration: none;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Welcome, admin</h1>
      <p>You successfully completed the SSO challenge by intercepting the second factor in the network traffic.</p>
      <div class="flag">{{ flag }}</div>
      <a href="/">Back to login</a>
    </div>
  </body>
</html>
