<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Single Sign-On Lab - Login</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background: #0f172a;
        color: #e5e7eb;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      .container {
        background: #111827;
        padding: 2rem 2.5rem;
        border-radius: 0.75rem;
        box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        width: 360px;
      }
      h1 {
        margin-top: 0;
        font-size: 1.4rem;
        margin-bottom: 1rem;
        text-align: center;
      }
      label {
        display: block;
        margin-top: 0.75rem;
        margin-bottom: 0.25rem;
        font-size: 0.9rem;
      }
      input[type="text"],
      input[type="password"] {
        width: 100%;
        padding: 0.5rem 0.6rem;
        border-radius: 0.4rem;
        border: 1px solid #374151;
        background: #020617;
        color: #e5e7eb;
      }
      button {
        margin-top: 1.25rem;
        width: 100%;
        padding: 0.6rem;
        border-radius: 0.4rem;
        border: none;
        background: #2563eb;
        color: #e5e7eb;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: #1d4ed8;
      }
      .message {
        margin-top: 0.75rem;
        padding: 0.5rem 0.6rem;
        border-radius: 0.4rem;
        font-size: 0.85rem;
        background: #1f2933;
      }
      .hint {
        margin-top: 0.75rem;
        font-size: 0.75rem;
        color: #9ca3af;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Admin Login</h1>
      <form method="POST">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="off" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>

        <label for="sso_code">SSO Code</label>
        <input type="text" id="sso_code" name="sso_code" autocomplete="off">

        <button type="submit">Login</button>
      </form>

      {% if message %}
      <div class="message">{{ message }}</div>
      {% endif %}

      <div class="hint">
      </div>
    </div>
  </body>
</html>
